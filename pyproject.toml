[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-pdf-editor"
version = "0.1.0"
description = "Offline Windows-first PDF and image utilities"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6-Essentials==6.11.2", "pypdf==6.19.0", "pypdfium2==5.13.0",
  "Pillow==12.3.0", "pi-heif==1.4.0",
]

[project.gui-scripts]
local-pdf-editor = "local_pdf_editor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
