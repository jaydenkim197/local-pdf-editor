name: Verify PDF utilities
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng libegl1 libopengl0
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $version = & 'C:\Program Files\Tesseract-OCR\tesseract.exe' --version 2>&1 | Out-String
          "::notice title=Installed Windows OCR engine::$($version.Trim().Split("`n")[0])"
          $korean = 'C:\Program Files\Tesseract-OCR\tessdata\kor.traineddata'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/kor.traineddata' -OutFile $korean
          if ((Get-FileHash $korean -Algorithm SHA256).Hash.ToLowerInvariant() -ne '6b85e11d9bbf07863b97b3523b1b112844c43e713df8b66418a081fd1060b3b2') { throw 'Korean data checksum mismatch.' }
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Run full source suite
        run: python -m pytest -q --junitxml=reports/pytest.xml
      - name: Record actual test results
        if: always()
        run: python scripts/report_ci_results.py reports/pytest.xml
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ runner.os }}-${{ github.sha }}
          path: reports/pytest.xml
          if-no-files-found: warn
          retention-days: 14
      - run: python -m local_pdf_editor --smoke-test --heic-fixture tests/fixtures/sample.heic --ocr-smoke
      - if: runner.os == 'Windows'
        run: python scripts/package_app.py
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify_windows_package.ps1
      - name: Retain frozen Windows evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: frozen-Windows-${{ github.sha }}
          path: reports/windows-package-*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Prepare Windows development package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/LocalPdfUtilities -DestinationPath dist/LocalPdfUtilities-Windows-x64.zip
          $hash = (Get-FileHash dist/LocalPdfUtilities-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LocalPdfUtilities-Windows-x64.zip" | Set-Content dist/LocalPdfUtilities-Windows-x64.sha256 -Encoding ascii
          "## Windows development package`n`nSource tests and packaged smoke passed for $env:GITHUB_SHA. Download the Windows artifact, extract its ZIP and run LocalPdfUtilities/LocalPdfUtilities.exe. OCR still requires local Tesseract. Actual desktop/clean-machine and public-release checks remain pending.`n`nSHA-256: $hash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Retain verified Windows development package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: LocalPdfUtilities-Windows-x64-${{ github.sha }}
          path: |
            dist/LocalPdfUtilities-Windows-x64.zip
            dist/LocalPdfUtilities-Windows-x64.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
